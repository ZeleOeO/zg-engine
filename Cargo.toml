[package]
name = "zg-engine"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
members = ["crates/*", "crates/*/macros"]

[workspace.dependencies]
anyhow = "1.0.102"
bytemuck = "1.25.0"
env_logger = "0.11.10"
image = { version = "0.25.10", features = ["png", "jpeg"] }
log = "0.4.33"
pollster = "0.4.0"
wgpu = "29.0.3"
winit = "0.30.13"
tracy-client = { version = "0.19.0", features = ["enable"] }

[dependencies]
zg_app = { path = "crates/zg_app" }
zg_camera = { path = "crates/zg_camera" }
zg_graphics = { path = "crates/zg_graphics" }
zg_managers = { path = "crates/zg_managers" }
zg_render = { path = "crates/zg_render" }
zg_utils = { path = "crates/zg_utils" }
zg_world = { path = "crates/zg_world" }
zg_gltf = { path = "crates/zg_gltf" }
anyhow = { workspace = true }
